<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 400px;
      padding: 20px;
      font-family: Arial, sans-serif;
    }
    .setting {
      margin-bottom: 15px;
    }
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .shortcut {
      font-family: monospace;
      background: #f0f0f0;
      padding: 5px;
      border-radius: 3px;
    }
    .note {
      font-size: 12px;
      color: #666;
      margin-top: 5px;
    }
  </style>
</head>
<body>
  <h2>SpotlightPro Settings</h2>
  
  <div class="setting">
    <label>Keyboard Shortcut:</label>
    <div class="shortcut" id="shortcut">Ctrl+Shift+B (⌘+Shift+B on Mac)</div>
    <div class="note">Current implementation uses direct keyboard detection. Chrome shortcuts available at chrome://extensions/shortcuts</div>
  </div>

  <script src="options.js"></script>
</body>
</html>
