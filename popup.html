<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      width: 200px;
      padding: 12px;
      font-family: Arial, sans-serif;
      font-size: 13px;
    }
    .header {
      text-align: center;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }
    .instructions {
      font-size: 11px;
      color: #666;
      margin-bottom: 10px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 8px;
      font-size: 14px;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-bottom: 8px;
    }
    .settings-link {
      text-align: center;
      font-size: 11px;
      margin-top: 4px;
    }
    .settings-link a {
      color: #666;
      text-decoration: none;
    }
    .settings-link a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">SpotlightPro</div>
  <div class="instructions">Use Ctrl+Shift+B for full blur</div>
  <button id="blurBtn">Toggle Full Page Blur</button>
  <button id="selectBtn">Select Region to Blur</button>
  <div class="settings-link">
    <a href="#" id="settingsLink">⚙️ Settings</a>
  </div>
  <script src="popup.js"></script>
</body>
</html>
